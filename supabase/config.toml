# ============================================================================
# JM MAKER SPORTSWEAR — SUPABASE LOCAL / CLI CONFIGURATION
# Compatible with `supabase start`, `supabase db reset`, and `supabase db push`
# ============================================================================

project_id = "jm-sportswear"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/index.html",
  "http://localhost:5173/dashboard.html",
  "http://localhost:5173/buyer.html"
]
enable_signup = true

[storage]
enabled = true
file_size_limit = "5MiB"
